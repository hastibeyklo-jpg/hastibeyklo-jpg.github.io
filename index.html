<!-- 9th.grade.math | نسخه ارتقاء یافته آزمون مرحله‌ای -->
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>9th.grade.math</title>

<style>
body{margin:0;font-family:tahoma;background:#0b132b;color:white;transition:.4s}
header{background:linear-gradient(90deg,#00c6ff,#7b2ff7);padding:20px;text-align:center;font-size:22px;font-weight:bold}

nav{display:flex;flex-direction:row-reverse;gap:10px;padding:15px;flex-wrap:wrap}
button{border:none;padding:12px 18px;border-radius:15px;font-size:16px;cursor:pointer;color:white}

.home{background:#22c55e}
.jozve{background:#f59e0b}
.fact{background:#3b82f6}
.root{background:#ec4899}
.startBtn{background:#06b6d4;margin-top:20px}
.nextBtn{background:#6366f1}
.finishBtn{background:#22c55e}

/* تم‌ها */
.theme1{background:#0b132b}
.theme2{background:#1a0b2e}
.theme3{background:#06281f}

section{display:none;padding:20px}
.active{display:block}

.card{background:#111c44;padding:20px;border-radius:20px;margin-bottom:20px;animation:fade .5s}

/* رنگ‌های فانتزی نتیجه */
.correct{background:linear-gradient(135deg,#22c55e,#4ade80);box-shadow:0 0 15px #22c55e}
.wrong{background:linear-gradient(135deg,#ef4444,#f87171);box-shadow:0 0 15px #ef4444}
.blank{background:linear-gradient(135deg,#facc15,#fde047);color:black;box-shadow:0 0 15px #facc15}

.explain{background:#1e293b;margin-top:10px;padding:10px;border-radius:10px;font-size:14px;display:none}
.resultBox{background:#020617;padding:15px;border-radius:15px;margin-top:20px;font-size:18px}
.timer{font-size:20px;margin-bottom:15px;color:#facc15}

@keyframes fade{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>

<body class="theme1">
<header>سایت آموزشی ریاضی نهم</header>

<nav>
<button class="home" onclick="show('home')">خانه</button>
<button class="jozve" onclick="show('jozve')">مطالعه جزوه</button>
<button class="fact" onclick="prepareQuiz('fact')">آزمون فاکتوریل</button>
<button class="root" onclick="prepareQuiz('root')">آزمون ریشه سوم</button>

<!-- تغییر تم -->
<button onclick="setTheme(1)">تم ۱</button>
<button onclick="setTheme(2)">تم ۲</button>
<button onclick="setTheme(3)">تم ۳</button>
</nav>

<!-- خانه -->
<section id="home" class="active">
<div class="card">
<h2>سلام👋🏻! ✨خوش آمدید</h2>
این سایت توسط دانش آموزان پایه نهم<br>
هستی بیک لو و سلدا برجی طراحی شده است 🌸<br>
دبیر مربوطه: سرکار خانم صائمی 😊
</div>
</section>


<!-- جزوه -->
<section id="jozve">
<div class="card">
<h2>📚 دانلود دائمی جزوه</h2>

جزوه فاکتوریل:<br>
<a href="https://drive.google.com/file/d/1xBYJlrRqycphwWS2jImpIPbgUUGEKouv/view?usp=drivesdk" download>دانلود جزوه فاکتوریل</a>
<br><br>

جزوه ریشه سوم:<br>
<a href="jozve_cuberoot.pdf" download>دانلود جزوه ریشه سوم</a>

</div>
</section>


</div>
</section>

<!-- آزمون -->
<section id="quiz">
<div id="startBox" class="card" style="text-align:center">
<h2>آماده‌ای برای شروع آزمون؟ 😍</h2>
<button class="startBtn" onclick="startExam()">شروع آزمون</button>
</div>

<div id="examBox" style="display:none">
<div class="timer" id="timer">00:30</div>
<div id="questionBox"></div>

<!-- دکمه‌ها کنار هم -->
<button class="nextBtn" onclick="nextQuestion()">سوال بعدی</button>
<button class="finishBtn" onclick="finishExam()">پایان آزمون</button>

<div id="result" class="resultBox"></div>
</div>
</section>

<script>
function show(id){
 document.querySelectorAll('section').forEach(s=>s.classList.remove('active'));
 document.getElementById(id).classList.add('active');
}

function setTheme(n){
 document.body.className='theme'+n;
}

function loadFile(e,n){
 const file=e.target.files[0];
 const url=URL.createObjectURL(file);
 document.getElementById('link'+n).href=url;
 document.getElementById('link'+n).innerText="دانلود "+file.name;
}

/* ---------- بانک سوال ---------- */
const factorialQ=[
{q:"5!؟",o:["120","60","20","720"],a:0,e:"5!=120"},
{q:"4!؟",o:["24","12","8","6"],a:0,e:"4!=24"},
{q:"3!×2!؟",o:["12","6","4","24"],a:0,e:"6×2=12"},
{q:"7!/6!؟",o:["7","6","1","42"],a:0,e:"=7"},
{q:"0!؟",o:["1","0","-1","2"],a:0,e:"طبق تعریف"},
{q:"6!؟",o:["720","120","60","24"],a:0,e:"720"},
{q:"3!+4!؟",o:["30","24","12","18"],a:0,e:"6+24"},
{q:"8!/7!؟",o:["8","7","1","56"],a:0,e:"=8"},
{q:"2!؟",o:["2","1","0","4"],a:0,e:"2"},
{q:"1!؟",o:["1","0","2","-1"],a:0,e:"1"},
{q:"5!/4!؟",o:["5","4","20","1"],a:0,e:"=5"},
{q:"3!؟",o:["6","3","9","12"],a:0,e:"6"},
{q:"(3!)(3!)؟",o:["36","18","9","6"],a:0,e:"6×6"},
{q:"9!/8!؟",o:["9","8","1","72"],a:0,e:"=9"},
{q:"10!/9!؟",o:["10","9","1","90"],a:0,e:"=10"},
{q:"4!+2!؟",o:["26","12","8","10"],a:0,e:"24+2"},
{q:"6!/5!؟",o:["6","5","30","1"],a:0,e:"=6"},
{q:"7!؟",o:["5040","720","120","40320"],a:0,e:"5040"},
{q:"8!؟",o:["40320","5040","720","120"],a:0,e:"40320"},
{q:"2!+3!؟",o:["8","6","5","12"],a:0,e:"2+6"}
];

const rootQ=[
{q:"∛8؟",o:["2","4","8","3"],a:0,e:"2×2×2"},
{q:"∛27؟",o:["3","9","6","2"],a:0,e:"3×3×3"},
{q:"∛64؟",o:["4","8","6","3"],a:0,e:"4×4×4"},
{q:"∛125؟",o:["5","25","15","3"],a:0,e:"5×5×5"},
{q:"∛1؟",o:["1","0","3","-1"],a:0,e:"1"},
{q:"∛216؟",o:["6","3","9","12"],a:0,e:"6×6×6"},
{q:"∛(1/8)؟",o:["1/2","1/4","2","1/8"],a:0,e:"½"},
{q:"∛(-8)؟",o:["-2","2","-4","4"],a:0,e:"منفی"},
{q:"∛343؟",o:["7","3","6","14"],a:0,e:"7×7×7"},
{q:"∛512؟",o:["8","6","9","4"],a:0,e:"8×8×8"},
{q:"∛729؟",o:["9","3","6","12"],a:0,e:"9×9×9"},
{q:"∛1000؟",o:["10","100","5","20"],a:0,e:"10×10×10"},
{q:"∛(27/8)؟",o:["3/2","1/2","2/3","9/4"],a:0,e:"صورت و مخرج"},
{q:"∛(-27)؟",o:["-3","3","-9","9"],a:0,e:"منفی"},
{q:"∛64/∛8؟",o:["2","8","4","1"],a:0,e:"4÷2"},
{q:"∛216/∛27؟",o:["2","6","3","9"],a:0,e:"6÷3"},
{q:"∛1/∛1؟",o:["1","0","2","-1"],a:0,e:"1"},
{q:"∛512/∛64؟",o:["2","4","8","1"],a:0,e:"8÷4"},
{q:"∛125/∛5؟",o:["∛25","5","3","1"],a:0,e:"قانون ریشه"},
{q:"∛343/7؟",o:["1","7","49","3"],a:0,e:"7÷7"}
];

/* ---------- منطق آزمون ---------- */
let bank=[];
let selected=[];
let index=0;
let answers=[];
let time=30;
let timer;

function prepareQuiz(type){
show('quiz');
bank = type==='fact'?factorialQ:rootQ;
document.getElementById('startBox').style.display='block';
document.getElementById('examBox').style.display='none';
}

function startExam(){
selected=[...bank].sort(()=>0.5-Math.random()).slice(0,10);
answers=new Array(10).fill(null);
index=0;
document.getElementById('startBox').style.display='none';
document.getElementById('examBox').style.display='block';
showQuestion();
}

function showQuestion(){
if(index>=10)return;

const q=selected[index];
let html=`<div class='card'><b>سوال ${index+1}) ${q.q}</b><br>`;
q.o.forEach((op,i)=>{
html+=`<label><input type='radio' name='opt' value='${i}'> ${op}</label><br>`;
});
html+=`</div>`;

document.getElementById('questionBox').innerHTML=html;
startTimer();
}

function startTimer(){
clearInterval(timer);
time=30;
timer=setInterval(()=>{
let s=time%60;
document.getElementById('timer').innerText=`00:${s.toString().padStart(2,'0')}`;
if(time<=0){nextQuestion();}
time--;
},1000);
}

function nextQuestion(){
clearInterval(timer);
const sel=document.querySelector('input[name=opt]:checked');
answers[index]=sel?Number(sel.value):null;
index++;
if(index<10)showQuestion();
}

function finishExam(){
clearInterval(timer);
let c=0,w=0,b=0;
let html="";

selected.forEach((q,i)=>{
let cls="blank";
if(answers[i]===null)b++;
else if(answers[i]===q.a){cls="correct";c++;}
else{cls="wrong";w++;}

html+=`<div class='card ${cls}'>
<b>${i+1}) ${q.q}</b><br>
✔️ پاسخ صحیح: ${q.o[q.a]}<br>
📝 ${q.e}
</div>`;
});

document.getElementById('questionBox').innerHTML=html;
document.getElementById('result').innerHTML=
`نمره: ${c} از 10 ⭐<br>درست: ${c} 🟢<br>غلط: ${w} 🔴<br>نزده: ${b} 🟡`;
}
</script>
</body>
</html>
